
name: Build AmneziaWG for Cudy TR3600

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Get TR3600 source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison gawk gettext git \
            libncurses-dev libssl-dev rsync unzip zlib1g-dev \
            file wget xz-utils libelf-dev python3 \
            python3-setuptools swig curl ca-certificates

      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-dl-tr3600-25.12-v2
          restore-keys: |
            openwrt-dl-tr3600-25.12-

      - name: Prepare exact TR3600 source
        run: |
          git clone --depth 1 -b openwrt-25.12 \
            https://github.com/openwrt/openwrt.git openwrt

          cd openwrt

          git fetch origin pull/24596/head
          ACTUAL=$(git rev-parse --short=8 FETCH_HEAD)
          echo "OpenWrt PR commit: $ACTUAL"

          if [ "$ACTUAL" != "046aec0d" ]; then
            echo "ERROR: PR source revision changed!"
            exit 1
          fi

          git checkout -f FETCH_HEAD
          git apply ../cudy-tr3600-v1-fixes.patch

          ./scripts/feeds update -a

          # Устанавливаем только необходимые компоненты LuCI.
          # Не используем feeds install -a: он подключал лишние пакеты.
          ./scripts/feeds install -p luci luci-base luci-lib-uqr

      - name: Add AmneziaWG packages
        run: |
          git clone --depth 1 \
            https://github.com/Slava-Shchipunov/awg-openwrt.git awg

          mkdir -p openwrt/package/awg

          cp -r awg/kmod-amneziawg openwrt/package/awg/
          cp -r awg/amneziawg-tools openwrt/package/awg/
          cp -r awg/luci-proto-amneziawg openwrt/package/awg/

      - name: Configure TR3600 and AmneziaWG
        run: |
          cd openwrt

          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3600-v1=y

          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-proto-wireguard=y

          CONFIG_PACKAGE_kmod-gre=y
          CONFIG_PACKAGE_gre=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_ip-full=y

          CONFIG_PACKAGE_kmod-amneziawg=m
          CONFIG_PACKAGE_amneziawg-tools=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-lib-uqr=y
          CONFIG_PACKAGE_luci-proto-amneziawg=y
          EOF

          make defconfig

          grep -q "CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3600-v1=y" .config
          grep -q "CONFIG_PACKAGE_kmod-amneziawg=m" .config

          echo "Build configuration:"
          grep -E 'CONFIG_TARGET_mediatek|CONFIG_PACKAGE_(kmod-amneziawg|amneziawg-tools|luci-proto-amneziawg)' .config

      - name: Prepare build tools
        run: |
          cd openwrt
          make tools/install -j2
          make toolchain/install -j2

      - name: Build matching TR3600 kernel
        run: |
          cd openwrt
          make -j2 target/linux/compile V=s

      - name: Build AmneziaWG packages
        run: |
          cd openwrt
          make -j2 package/awg/kmod-amneziawg/compile V=s
          make -j2 package/awg/amneziawg-tools/compile V=s
          make -j2 package/awg/luci-proto-amneziawg/compile V=s

      - name: Save packages
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-cudy-tr3600
          path: openwrt/bin/packages/
          if-no-files-found: error
